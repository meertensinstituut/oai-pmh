networks:
  traefik-public:
    external: true

services:
  isebel-oai-pmh:
    restart: unless-stopped
    image: registry.diginfra.net/tsd/oai-pmh:v2-php8.1
    container_name: isebel-oai-pmh
    volumes:
      - ./web/src:/var/www/html
    ports:
      - "38999:80"
    networks:
      - traefik-public
